# BotC scripts + Discord bot — standalone deployment stack.
#
# Self-contained: nothing is cloned, nothing is built here. GitHub Actions builds both
# images on push and publishes them to GHCR; this host only pulls them. Paste the file
# into Dockge, or save it as compose.yaml.
#
#   docker compose pull && docker compose up -d
#
# which is exactly what Dockge's Update button does, so that button is all you need.
# `docker compose logs -f init` shows migrations, characters and accounts; it exits 0.
#
# Deploying a change is: push to the branch, wait for Actions to go green, press Update.
# Nothing compiles on this machine.
#
# Published on 8480, not 8000: paperless already holds 8000 on this host. Only the host
# side moves — the container still listens on 8000, and the bot reaches it at
# http://botc-scripts:8000 over the internal network, never via the published port.
#
# REQUIRED in .env beside this file (or Dockge's environment box):
#   SECRET_KEY                 python3 -c "import secrets; print(secrets.token_urlsafe(64))"
#   POSTGRES_PASSWORD          python3 -c "import secrets; print(secrets.token_urlsafe(24))"
#   DJANGO_SUPERUSER_PASSWORD  your /admin login
#   BOTC_API_PASSWORD          the account the bot writes custom ids as
#   DISCORD_TOKEN              https://discord.com/developers/applications
#
# BEHIND A PROXY, also set:
#   DJANGO_HOST=scripts.example.com botc-scripts localhost 127.0.0.1
#   CSRF_TRUSTED_ORIGINS=https://scripts.example.com
#   BEHIND_TLS_PROXY=True
#
# DJANGO_HOST must keep botc-scripts: that is the Host the bot sends over the internal
# network, and Django answers 400 to anything unlisted. BEHIND_TLS_PROXY marks cookies
# secure, so set it only when a proxy really is in front or you cannot log in over http.

name: botc

# init and botc-scripts must run the SAME image and the SAME environment: init applies
# the migrations the app then expects, so any drift between them fails in a confusing
# way. Defined once here and referenced by both, rather than duplicated.
x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set. Generate one and put it in .env.}
  DEBUG: ${DEBUG:-False}
  DJANGO_HOST: ${DJANGO_HOST:-localhost 127.0.0.1 botc-scripts}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  BEHIND_TLS_PROXY: ${BEHIND_TLS_PROXY:-False}
  DBHOST: db
  DBPORT: "5432"
  # Seconds a database connection is reused for; 0 turns persistent connections off.
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  DBNAME: ${POSTGRES_DB:-botc}
  DBUSER: ${POSTGRES_USER:-botc}
  DBPASS: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Choose one and put it in .env.}
  UPLOAD_DISABLED: ${UPLOAD_DISABLED:-False}
  BANNER: ${BANNER:-}
  # Who may register, one switch for each way in; login is unaffected. See ACCOUNTS.md.
  LOCAL_SIGNUP_ENABLED: ${LOCAL_SIGNUP_ENABLED:-True}
  SOCIAL_SIGNUP_ENABLED: ${SOCIAL_SIGNUP_ENABLED:-True}
  # Arrivals: new scripts and new versions, announced to a Discord channel. Blank means
  # none are announced, which is the default. See NOTIFICATIONS.md in the fork.
  DISCORD_ARRIVALS_WEBHOOK_URL: ${DISCORD_ARRIVALS_WEBHOOK_URL:-}
  DISCORD_ARRIVALS_WEBHOOK_MENTION: ${DISCORD_ARRIVALS_WEBHOOK_MENTION:-}
  # A separate webhook for versions being marked as on the Minecraft server, so those can
  # go to a different channel. Independent of the arrivals pair above; blank switches it off.
  DISCORD_ONLINE_WEBHOOK_URL: ${DISCORD_ONLINE_WEBHOOK_URL:-}
  DISCORD_ONLINE_WEBHOOK_MENTION: ${DISCORD_ONLINE_WEBHOOK_MENTION:-}
  # What puts a working link in either kind of message. The sync container has no request
  # to learn the site's address from, so it is configured; blank falls back to the first
  # CSRF trusted origin.
  SITE_URL: ${SITE_URL:-}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  # Read only by `manage.py bootstrap`. A blank password skips that account with a
  # warning rather than inventing a guessable default.
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  BOTC_API_USERNAME: ${BOTC_API_USERNAME:-discordbot}
  BOTC_API_EMAIL: ${BOTC_API_EMAIL:-}
  BOTC_API_PASSWORD: ${BOTC_API_PASSWORD:-}
  BOOTSTRAP_RESET_PASSWORDS: ${BOOTSTRAP_RESET_PASSWORDS:-False}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Choose one and put it in .env.}
      POSTGRES_DB: ${POSTGRES_DB:-botc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [botc]
    healthcheck:
      # -h 127.0.0.1 is load-bearing. During initdb the entrypoint runs a temporary
      # server with listen_addresses='', so a plain pg_isready reports success over the
      # unix socket while the database is still initialising.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot and idempotent. A separate service rather than an entrypoint script so
  # depends_on gives a hard ordering guarantee, three gunicorn workers cannot race each
  # other running migrate, and a failure surfaces as a non-zero exit.
  init:
    image: ${APP_IMAGE:-ghcr.io/lewismelotech/slug-status:latest}
    restart: "no"
    environment: *app-env
    volumes:
      - appdata:/data
    networks: [botc]
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -ceu "
        python manage.py migrate --noinput &&
        python manage.py loaddata dev/characters &&
        python manage.py bootstrap
      "

  botc-scripts:
    # Published by GitHub Actions on every push to custom-slugs. Set APP_IMAGE to a
    # :sha-xxxxxxx tag to hold a known-good build, or to roll one back.
    image: ${APP_IMAGE:-ghcr.io/lewismelotech/slug-status:latest}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - appdata:/data
    networks: [botc]
    ports:
      # 8480 because 8000 is taken by paperless on this host, and 0.0.0.0 because the
      # proxy (nginx-proxy-manager) is itself a container: 127.0.0.1 in its forward
      # field would mean the proxy container, not the host. Point NPM at the host's LAN
      # address on this port, scheme http.
      #
      # This publishes on every interface, so anything that can route to the host can
      # reach the app directly, bypassing the proxy and its TLS. Firewall the port to
      # the proxy, or drop this block entirely and use the shared-network option below.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8480}:8000"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      # Neither image ships curl or wget. The missing trailing slash matters: the route
      # is path("health-check", ...) and /health-check/ is a 404. Liveness only — what
      # proves the database is usable is init having exited 0.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health-check", timeout=5).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  bot:
    image: ${BOT_IMAGE:-ghcr.io/lewismelotech/discord-botc-script-bot:latest}
    # on-failure:3 rather than unless-stopped: with no DISCORD_TOKEN the bot exits 2 by
    # design, and this lets it settle at Exited(2) instead of crash-looping. The database
    # and site are unaffected either way.
    restart: on-failure:3
    environment:
      # :- not :? — the site must come up with no token.
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      BOTC_BASE_URL: http://botc-scripts:8000
      # What the bot prints in replies. BOTC_BASE_URL above only resolves inside this
      # network, so it cannot be the link people click. This reuses the site's own address
      # (SITE_URL, which announcements use too); left blank it falls back to the internal
      # one and replies carry links nobody outside the stack can open.
      BOTC_PUBLIC_URL: ${SITE_URL:-}
      BOTC_CACHE_PATH: /data/botc-suggestions.sqlite3
      BOTC_CACHE_ENTRIES: ${BOTC_CACHE_ENTRIES:-500}
      BOTC_RENDER_DPI: ${BOTC_RENDER_DPI:-150}
      BOTC_MAX_PAGES: ${BOTC_MAX_PAGES:-10}
      BOTC_HTTP_TIMEOUT: ${BOTC_HTTP_TIMEOUT:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Which version /script, /json and /commands serve when none is asked for. Blank
      # means auto, which is online in this stack: only scripts marked as on the Minecraft
      # server. latest serves the newest version of everything. /alias ignores it.
      BOTC_SELECTION: ${BOTC_SELECTION:-}
      # The older true/false form of the same choice. Read only while BOTC_SELECTION is
      # blank, so a stack that still sets it keeps its meaning; blank means unset.
      BOTC_ONLINE_ONLY: ${BOTC_ONLINE_ONLY:-}
      # The bot requires these both-or-neither, so the username must not default to a
      # value while the password is empty: that is half a credential, and the bot exits 2
      # rather than starting up unable to write. :+ makes the username appear only when a
      # password is actually set.
      BOTC_API_USER: ${BOTC_API_PASSWORD:+${BOTC_API_USERNAME:-discordbot}}
      BOTC_API_PASSWORD: ${BOTC_API_PASSWORD:-}
    volumes:
      - botdata:/data
    networks: [botc]
    depends_on:
      botc-scripts:
        condition: service_healthy

  # Pulls new versions of linked scripts from wherever they were imported from. Runs once
  # a day at SYNC_AT, 09:00 UK time by default: it sleeps until then rather than counting
  # from container start, so a restart does not shift the schedule. Sync only ever ADDS
  # versions, and new ones arrive offline, so this never changes what the bot serves
  # without a human marking it.
  sync:
    image: ${APP_IMAGE:-ghcr.io/lewismelotech/slug-status:latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      # "-" rather than ":-": SYNC_AT= set empty in .env means "use SYNC_PERIOD instead".
      SYNC_AT: ${SYNC_AT-09:00}
      SYNC_PERIOD: ${SYNC_PERIOD:-3600}
      SYNC_ON_START: ${SYNC_ON_START:-false}
      # Only the shell loop below reads this. Django sets its own TZ from TIME_ZONE, so
      # sync_upstream still works, and stamps last_synced, in UTC.
      TZ: ${SYNC_TIMEZONE:-Europe/London}
    volumes:
      - appdata:/data
    networks: [botc]
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # SYNC_AT is a time of day in SYNC_TIMEZONE, and the clock change is handled: 09:00
    # stays 09:00 in London through BST and GMT. Set SYNC_AT empty to run every
    # SYNC_PERIOD seconds instead, aligned to the period boundary. A failure is logged and
    # the loop continues — someone else's server being down should not stop the schedule.
    #
    # SYNC_ON_START runs one sync immediately as well. Off by default: the stack gets
    # restarted repeatedly while it is being set up, and every restart would be another
    # pass over someone else's server for no new data.
    command: >
      sh -ceu '
        if [ -n "$${SYNC_AT}" ]; then
          # Without zone data, date would quietly use UTC and run an hour out in summer.
          [ -f "/usr/share/zoneinfo/$${TZ}" ] || { echo "SYNC_TIMEZONE $${TZ} is not a time zone this image knows"; exit 1; }
          date -d "today $${SYNC_AT}" >/dev/null 2>&1 || { echo "SYNC_AT must be a time of day such as 09:00, not $${SYNC_AT}"; exit 1; }
          echo "upstream sync daily at $${SYNC_AT} $${TZ}"
        else
          period=$${SYNC_PERIOD:-3600}
          echo "upstream sync every $${period}s, aligned to the period boundary"
        fi
        case "$${SYNC_ON_START:-false}" in
          1|[Tt]rue|[Yy]es|[Oo]n)
            echo "SYNC_ON_START is set: syncing now as well"
            python manage.py sync_upstream || echo "start-up sync failed; the schedule is unaffected"
            ;;
        esac
        while true; do
          if [ -n "$${SYNC_AT}" ]; then
            now=$$(date +%s)
            next=$$(date -d "today $${SYNC_AT}" +%s)
            [ "$$next" -gt "$$now" ] || next=$$(date -d "tomorrow $${SYNC_AT}" +%s)
            echo "next sync at $$(date -d "@$$next" "+%Y-%m-%d %H:%M %Z")"
            sleep $$(( next - now ))
          else
            sleep $$(( period - ($$(date +%s) % period) ))
          fi
          python manage.py sync_upstream || echo "sync failed; retrying at the next scheduled time"
        done
      '

networks:
  botc:
    driver: bridge
  # To let a containerised proxy reach the app by name, uncomment this, add `proxy` to
  # the botc-scripts service's networks, and forward to http://botc-scripts:8000.
  # proxy:
  #   external: true
  #   name: <your proxy's network>

volumes:
  pgdata:   # Postgres data directory.
  appdata:  # /data/public/media (uploaded script PDFs) and /data/icon_cache.
  botdata:  # The bot's SQLite autocomplete cache and its WAL sidecars.
